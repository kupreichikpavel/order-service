name: CI Pipeline

on:
  push:
    branches:
      - main
      - epic/order-service
      - 'feature/**'
  pull_request:
    branches:
      - main
      - epic/order-service

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test bootJar --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: build/libs/*.jar
          if-no-files-found: error

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t order-service:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save order-service:${{ github.sha }} \
            | gzip > order-service-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: order-service-docker-image
          path: order-service-image.tar.gz
          if-no-files-found: error
