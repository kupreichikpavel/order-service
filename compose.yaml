services:
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: order-service:local

    environment:
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SERVER_PORT: "8083"

      JWT_ISSUER_URI: "http://keycloak:8080/realms/shopper"
      JWT_JWK_SET_URI: "http://host.docker.internal:8082/realms/shopper/protocol/openid-connect/certs"
      JWT_AUDIENCE: "order-service"

      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    ports:
      - "${SERVER_PORT:-8083}:8083"

    depends_on:
      order-db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  order-db-data:
